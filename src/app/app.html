<div class="app-shell">
  <div class="mobile-scrim" [class.visible]="sidebarOpen()" (click)="closeSidebar()"></div>

  <aside class="app-nav" [class.open]="sidebarOpen()">
    <div class="nav-identity">
      <div class="identity-mark" aria-hidden="true"><b>LD</b></div>
      <div><strong>Lead Data Module</strong></div>
      <button class="nav-close" aria-label="Close navigation" (click)="closeSidebar()">
        ×
      </button>
    </div>

    <nav class="primary-nav">
      <div class="nav-group">
        <p>Customer data</p>
        <a routerLink="/customer-master" routerLinkActive="active" (click)="closeSidebar()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
            />
          </svg>
          <span><strong>Customer Master</strong><small>Companies & contacts</small></span>
        </a>
      </div>

      <div class="nav-group">
        <p>Lead Data Module</p>
        <a routerLink="/sales/view" routerLinkActive="active" (click)="closeSidebar()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19V9M10 19V5M16 19v-7M22 19V3M2 19h22" />
          </svg>
          <span><strong>Lead Register</strong><small>View, filter & export</small></span>
        </a>
        <a routerLink="/sales/import" routerLinkActive="active" (click)="closeSidebar()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
          </svg>
          <span><strong>Upload Leads</strong><small>Excel & event contacts</small></span>
        </a>
        <a routerLink="/sales/find" routerLinkActive="active" (click)="closeSidebar()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>
          <span><strong>Company Lookup</strong><small>Verify across modules</small></span>
        </a>
      </div>
    </nav>

    <div class="ennoble-brand" aria-label="Ennoble IP">
      <span class="ennoble-mark">EP</span>
      <div><small></small><strong>Ennoble IP</strong></div>
      <i aria-hidden="true"></i>
    </div>
  </aside>

  <main class="app-main">
    <header class="topbar">
      <div class="topbar-left">
        <button
          class="menu-trigger"
          aria-label="Open navigation"
          title="Open workspace menu"
          (click)="sidebarOpen.set(true)"
        >
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
      </div>
      <div class="topbar-right">
        <button class="dashboard-button" type="button" (click)="openDashboard()" title="Dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span>Dashboard</span>
        </button>
        <button class="logout-button" type="button" (click)="logout()" title="Logout">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 17l5-5-5-5M15 12H3M14 3h4a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-4" />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>

@if (loader.visible()) {
  <div class="global-loader" role="status" aria-live="polite" [attr.aria-label]="loader.message()">
    <div class="global-loader-card">
      <div class="loader-orbit" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="global-loader-copy">
        <strong>{{ loader.message() }}</strong>
        <span>Please wait, this may take a moment.</span>
      </div>
      <div class="loader-progress" aria-hidden="true"><i></i></div>
    </div>
  </div>
}
